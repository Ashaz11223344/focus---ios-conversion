name: iOS IPA Build (KMP)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'shared/**'
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  IPA_NAME: "Focus"
  MIN_IOS_VERSION: "14.0"

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.3'

      - name: Build KMP Shared XCFramework
        run: |
          echo "Building Kotlin Multiplatform iOS XCFramework..."
          ./gradlew :shared:assembleSharedReleaseXCFramework --stacktrace
          
          echo "Verifying generated XCFramework output:"
          find shared/build -name "*.xcframework" -o -name "*.framework" || true

      - name: Install CocoaPods Dependencies (if Podfile exists)
        working-directory: ios
        run: |
          if [ -f "Podfile" ]; then
            pod install --repo-update || pod install || echo "Pod install skipped/not required"
          fi

      - name: Clean iOS Build Directory
        run: |
          rm -rf ios/build
          mkdir -p ios/build

      - name: Build Xcode Archive (Unsigned)
        run: |
          if [ -d "ios/Focus.xcworkspace" ]; then
            PROJECT_ARG="-workspace ios/Focus.xcworkspace"
          else
            PROJECT_ARG="-project ios/Focus.xcodeproj"
          fi
          
          xcodebuild archive \
            $PROJECT_ARG \
            -scheme Focus \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ios/build/Focus.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned Sideloadable IPA
        run: |
          mkdir -p ios/build/Payload
          cp -R ios/build/Focus.xcarchive/Products/Applications/Focus.app ios/build/Payload/
          
          # Remove code signatures if any exist to ensure clean unsigned IPA for AltStore / Sideloadly
          rm -rf ios/build/Payload/Focus.app/_CodeSignature
          
          cd ios/build
          zip -q -r -9 "${IPA_NAME}.ipa" Payload
          
          echo "Generated IPA details:"
          ls -lh "${IPA_NAME}.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Focus-iOS-IPA-${{ github.run_number }}
          path: ios/build/${{ env.IPA_NAME }}.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/build/${{ env.IPA_NAME }}.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
